            timeoutSeconds: 5
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 3
          args:
            - "run"
            - "--server"
            - "--set=services.nginx.url=http://auth-opa-policies-service:8080"
            - "--set=bundles.nginx.service=nginx"
            - "--set=bundles.nginx.resource=bundles/bundle.tar.gz"
        - name: czertainly-core
          image: docker.io/czertainly/czertainly-core:2.14.0
          imagePullPolicy: IfNotPresent
          env:
            - name: HEADER_ENABLED
              value: "true"
            - name: HEADER_NAME
              value: "ssl-client-cert"
            - name: JDBC_URL
              value: "jdbc:postgresql://db.example.com:5432/czertainlydb?characterEncoding=UTF-8"
            - name: JDBC_USERNAME
              valueFrom:
                secretKeyRef:
                  name: core-secret
                  key: jdbcUsername
            - name: JDBC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: core-secret
                  key: jdbcPassword
            - name: LOGGING_LEVEL_COM_CZERTAINLY
              value: "INFO"
            - name: ADMIN_CERT
              valueFrom:
                secretKeyRef:
                  name: admin-certificate-secret
                  key: tls.crt
            - name: OPA_BASE_URL
              value: "http://localhost:8181"
            - name: AUTH_SERVICE_BASE_URL
              value: "http://auth-service:8080"
            - name: TRUSTED_CERTIFICATES
              valueFrom:
                secretKeyRef:
                  name: trusted-certificates
                  key: ca.crt
            - name: JAVA_OPTS
              value: ""
            - name: RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: global-configmap
                  key: messaging.host
            - name: RABBITMQ_PORT
              valueFrom:
                configMapKeyRef:
                  name: global-configmap
                  key: messaging.amqp.port
            - name: RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
